name: Atualizar mirror de extensões

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar identidade do bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Instalar dependências
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Baixar versões atuais e detectar mudanças
        id: download
        run: |
          set -e
          mkdir -p new-crx
          CHANGED=0

          # Lista de extensões: id, nome-de-referência
          declare -A EXT_IDS=(
            [fkagelmloambgokoeokbpihmgpkbgbfm]="RoPro"
            [hkgfoiooedgoejojocmhlaklaeopbecg]="IndieWikiBuddy"
            [adbacgifemdbhdkfppmeilbgppmhaobf]="VoltaDescurtidas"
            [hbkpclpemjeibhioopcebchdmohaieln]="BTRoblox"
            [gebbhagfogifgggkldgodflihgfeippi]="PictureInPicture"
            [jgnigeenijnjlahckhfomimnjadmkmah]="RevedditLinker"
            [dhdgffkkebhmkfjojejmpbldmpobfkfo]="Tampermonkey"
          )

          declare -A NEW_VERSIONS

          for id in "${!EXT_IDS[@]}"; do
            name="${EXT_IDS[$id]}"
            echo "=== Verificando $name ($id) ==="

            curl -s -L -o "new-crx/${id}.crx" \
              "https://clients2.google.com/service/update2/crx?response=redirect&os=linux&arch=x64&os_arch=x86_64&nacl_arch=x86-64&prod=chromiumcrx&prodchannel=unknown&prodversion=140.0.0.0&acceptformat=crx3&x=id%3D${id}%26uc"

            filesize=$(stat -c%s "new-crx/${id}.crx" 2>/dev/null || echo 0)
            if [ "$filesize" -lt 1000 ]; then
              echo "!!! Download de $name falhou, pulando"
              rm -f "new-crx/${id}.crx"
              continue
            fi

            version=$(python3 -c "
import struct, zipfile, io, json
with open('new-crx/${id}.crx', 'rb') as f:
    data = f.read()
magic, ver = struct.unpack('<4sI', data[:8])
if ver == 2:
    pk_len, sig_len = struct.unpack('<II', data[8:16])
    start = 16 + pk_len + sig_len
else:
    hdr_len, = struct.unpack('<I', data[8:12])
    start = 12 + hdr_len
z = zipfile.ZipFile(io.BytesIO(data[start:]))
m = json.loads(z.read('manifest.json').decode('utf-8-sig'))
print(m['version'])
")

            echo "Versão detectada: $version"
            NEW_VERSIONS[$id]="$version"

            # Compara com a versão atual no update.xml
            current_version=$(grep -A1 "appid='${id}'" update.xml 2>/dev/null | grep -oP "version='\K[^']+" || echo "none")

            if [ "$current_version" != "$version" ]; then
              echo "Nova versão! ($current_version -> $version)"
              mv "new-crx/${id}.crx" "new-crx/${id}_${version}.crx"
              CHANGED=1
            else
              echo "Sem mudança."
              rm -f "new-crx/${id}.crx"
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          # Salva o mapa de versões pro próximo step
          for id in "${!NEW_VERSIONS[@]}"; do
            echo "${id}=${NEW_VERSIONS[$id]}" >> versions.env
          done

      - name: Criar release com os novos .crx
        if: steps.download.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mirror-update-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" new-crx/*.crx \
            --title "Atualização automática do mirror" \
            --notes "Atualizado automaticamente via GitHub Actions em $(date -u +%Y-%m-%d)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Regenerar update.xml
        if: steps.download.outputs.changed == '1'
        run: |
          python3 << 'PYEOF'
import os, re

repo = os.environ.get('GITHUB_REPOSITORY', 'igaktgithub/helium-ext-mirror')
tag = os.environ.get('TAG', '')

versions = {}
with open('versions.env') as f:
    for line in f:
        if '=' in line:
            k, v = line.strip().split('=', 1)
            versions[k] = v

# Lê o update.xml atual pra manter entradas não alteradas
existing = {}
if os.path.exists('update.xml'):
    with open('update.xml') as f:
        content = f.read()
    for m in re.finditer(r"appid='([^']+)'>\s*<updatecheck codebase='([^']+)' version='([^']+)'", content):
        existing[m.group(1)] = (m.group(2), m.group(3))

for ext_id, version in versions.items():
    codebase = f"https://github.com/{repo}/releases/download/{tag}/{ext_id}_{version}.crx"
    existing[ext_id] = (codebase, version)

lines = ['<?xml version="1.0" encoding="UTF-8"?>',
         '<gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">']
for ext_id, (codebase, version) in sorted(existing.items()):
    lines.append(f"  <app appid='{ext_id}'>")
    lines.append(f"    <updatecheck codebase='{codebase}' version='{version}' />")
    lines.append('  </app>')
lines.append('</gupdate>')

with open('update.xml', 'w') as f:
    f.write('\n'.join(lines))
PYEOF

      - name: Commit do update.xml
        if: steps.download.outputs.changed == '1'
        run: |
          git add update.xml
          git commit -m "chore: atualiza mirror de extensões [automated]"
          git push
